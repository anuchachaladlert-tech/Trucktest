<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Truck Tracking</title>
  <!-- โหลด A-Frame และ MindAR -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  
  <style>
    body { margin: 0; overflow: hidden; }
    #loading {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: white; font-family: sans-serif; font-size: 20px; z-index: 99;
      background: rgba(0,0,0,0.7); padding: 15px 25px; border-radius: 10px;
    }
  </style>
</head>
<body>
  <div id="loading">กำลังโหลดระบบ AR... กรุณารอสักครู่</div>

  <a-scene 
    mindar-image="imageTargetSrc: target.mind; smooth: true; smoothCount: 5;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <!-- โหลดโมเดลรถบรรทุก (เปลี่ยนลิงก์หรือใช้ไฟล์ตัวเองได้) -->
      <a-asset-item id="truckModel" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.2/examples/image-tracking/assets/card-example/softmind/scene.gltf"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- ผูกกับ Image Target (index 0) -->
    <a-entity mindar-image-target="targetIndex: 0" id="target-entity">
      
      <!-- กลุ่มสำหรับหมุนรถบรรทุกให้วิ่งวนรอบภาพ -->
      <a-entity id="truck-orbit" animation="property: rotation; to: 0 360 0; dur: 4000; loop: true; easing: linear">
        <!-- ตัวรถบรรทุก (วางไว้ห่างจากจุดศูนย์กลางเพื่อให้วิ่งเป็นวงกลม) -->
        <a-entity 
          gltf-model="#truckModel" 
          position="0.5 0 0" 
          scale="0.01 0.01 0.01" 
          rotation="0 90 0">
        </a-entity>
      </a-entity>

    </a-entity>
  </a-scene>

  <script>
    // ซ่อนข้อความโหลดเมื่อระบบพร้อม
    document.querySelector('a-scene').addEventListener('loaded', function () {
      document.getElementById('loading').style.display = 'none';
    });

    // จำลองระบบตรวจจับมือ/วัตถุกีดขวาง (เมื่อเอาอะไรไปบังกล้องจน Target หายไปชั่วขณะ หรือแตะจอ)
    const targetEntity = document.querySelector('#target-entity');
    const truckOrbit = document.querySelector('#truck-orbit');

    targetEntity.addEventListener('targetLost', event => {
      console.log("ตรวจพบบัง/เอามือทับภาพ รถหยุดหรือเปลี่ยนความเร็ว");
      // เร่งความเร็วรถเมื่อเอามือมาวางทับ/บัง
      truckOrbit.setAttribute('animation', 'dur: 1500'); 
    });

    targetEntity.addEventListener('targetFound', event => {
      console.log("เจอภาพปกติ");
      // กลับมาวิ่งความเร็วปกติ
      truckOrbit.setAttribute('animation', 'dur: 4000');
    });
  </script>
</body>
</html>
